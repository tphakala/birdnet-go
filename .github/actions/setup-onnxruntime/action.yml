name: 'Setup ONNX Runtime'
description: 'Download, cache, and install ONNX Runtime library'

inputs:
  onnxruntime-version:
    description: 'ONNX Runtime version'
    required: false
    default: '1.32.0'
  target-platform:
    description: 'Target platform: linux-amd64, linux-arm64, windows-amd64, darwin-arm64'
    required: false
    default: 'linux-amd64'

runs:
  using: 'composite'
  steps:
    - name: Cache ONNX Runtime
      uses: actions/cache@v5
      with:
        # Use runner.temp, not /tmp. actions/cache evaluates `path` in Node, which
        # on a native Windows runner reads /tmp as the absolute path C:\tmp, while
        # the shell: bash steps (Git Bash/MSYS) map /tmp to a different directory.
        # On a cache hit Node would then restore the libs where the bash install
        # step cannot find them. runner.temp (Node) and $RUNNER_TEMP (bash) resolve
        # to the same directory on every OS, so the two stay in agreement.
        path: ${{ runner.temp }}/onnxruntime/lib
        # The script hash carries the download source (the switch lives in
        # scripts/fetch-onnxruntime.sh) and the pin file hash carries the pins.
        key: onnxruntime-${{ inputs.target-platform }}-${{ inputs.onnxruntime-version }}-${{ hashFiles('scripts/fetch-onnxruntime.sh', 'scripts/onnxruntime-pins.sha256') }}

    # Runs on a cache hit too: the script re-verifies the restored files against
    # the pins, repairs links and modes, and fails on anything it did not create.
    # On a miss it downloads and verifies the libraries first.
    - name: Install ONNX Runtime libraries
      shell: bash
      env:
        ORT_VERSION: ${{ inputs.onnxruntime-version }}
        ORT_PLATFORM: ${{ inputs.target-platform }}
      run: |
        sh "${GITHUB_WORKSPACE}/scripts/fetch-onnxruntime.sh" install \
          "${ORT_VERSION}" "${ORT_PLATFORM}" "${RUNNER_TEMP}/onnxruntime/lib"
        echo "ONNX Runtime lib contents:"
        ls -la "${RUNNER_TEMP}/onnxruntime/lib/"

    - name: Install ONNX Runtime to system path
      shell: bash
      run: |
        ONNX_DIR="${RUNNER_TEMP}/onnxruntime"
        case "${{ inputs.target-platform }}" in
          linux-amd64)
            sudo cp "${ONNX_DIR}"/lib/libonnxruntime*.so* /usr/lib/
            sudo ldconfig
            ;;
          linux-arm64)
            sudo cp "${ONNX_DIR}"/lib/libonnxruntime*.so* /usr/aarch64-linux-gnu/lib/
            ;;
        esac
