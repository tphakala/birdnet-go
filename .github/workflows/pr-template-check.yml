name: PR Template Check

# Checks that open pull requests from forks, other than the repository owner's,
# follow .github/pull_request_template.md: every template section present and
# filled in, the Contributing Guidelines and relicensing boxes ticked (a
# "relicense: consented" label stands in for the relicensing box), and for feat
# PRs the feature ownership box ticked and a linked issue or discussion. A failing PR gets the "needs: template" label and
# one comment listing what is missing; both go away once the description is
# fixed. The "template: exempt" label skips the check.
#
# pull_request_target is needed to label and comment on fork PRs. It is safe here
# because the job checks out the .github directory (plus the root-level files a
# cone-mode sparse checkout always includes) of the base branch tip, the same
# commit this workflow file comes from, and reads the PR title and body as data
# from the event payload. Never check out or run the pull request's code
# in this workflow.
on:
  pull_request_target:
    # synchronize re-runs the check on every push to the pull request.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-template-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-template:
    # Open fork PRs only, and not bots or the repository owner's own PRs. Edits
    # and label changes on closed or merged PRs, such as relicensing labels, are
    # not checked. Every label event on an open PR re-runs the full check rather
    # than skipping: a skipped run would replace a failed check on the PR and read
    # as a pass. Label changes made by this job use GITHUB_TOKEN, so they do not
    # trigger new runs.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-24.04
    # The check parses one PR description; it finishes in seconds.
    timeout-minutes: 5
    permissions:
      contents: read
      # Adds and removes the label and the comment on the pull request.
      pull-requests: write
    steps:
      # No ref: under pull_request_target, checkout defaults to the base branch tip.
      # The PR's base.sha is older for any PR not rebased since this script landed.
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Check the pull request description
        uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/scripts/pr-template-check.cjs');
            await run({ github, context, core });

