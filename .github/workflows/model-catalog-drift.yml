name: Model Catalog Drift

on:
  pull_request:
    paths:
      - 'internal/classifier/gen/**'
      - 'internal/classifier/model_catalog_regional_gen.go'
      - 'internal/classifier/region/data/**'
  push:
    branches:
      - main
    paths:
      - 'internal/classifier/gen/**'
      - 'internal/classifier/model_catalog_regional_gen.go'
      - 'internal/classifier/region/data/**'

permissions:
  contents: read

jobs:
  model-catalog-drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # This job only reads, regenerates, and diffs; it never pushes, so the
          # checkout token does not need to persist for later steps.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Regenerate regional model catalog
        # Offline by design: the generator reads the vendored manifests and the
        # committed labels-checksum sidecar, never the network.
        run: go generate ./internal/classifier

      - name: Check for drift
        run: |
          if git diff --exit-code -- internal/classifier/model_catalog_regional_gen.go; then
            echo "### Model Catalog In Sync" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Model Catalog Out Of Sync" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The committed \`internal/classifier/model_catalog_regional_gen.go\` does not match" >> $GITHUB_STEP_SUMMARY
            echo "the output of \`go generate ./internal/classifier\`." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run the following and commit the result:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "go generate ./internal/classifier" >> $GITHUB_STEP_SUMMARY
            echo "git add internal/classifier/model_catalog_regional_gen.go" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
