version: "2"
output:
  sort-order:
    - linter
    - severity
    - file
linters:
  exclusions:
    warn-unused: true
    rules:
      - path: frontend/
        text: ".*"
      # The OpenVINO cgo binding passes Go pointer addresses (&var) into C
      # output parameters, so go tool cgo emits _cgoCheckPointer(_, 0 == 0)
      # safety checks. gocritic's dupSubExpr flags that generated "0 == 0" and
      # maps it back to the source call lines. The finding is in cgo-generated
      # code, not handwritten code, so it is excluded for this file only.
      - path: internal/inference/openvino/backend_openvino.go
        text: "dupSubExpr"
        linters:
          - gocritic
      # The notflite stub build of NewTFLiteClassifier / NewTFLiteRangeFilter
      # always returns a non-nil error, so staticcheck's SA4023 flags the
      # `if err != nil` guards (and their related-information notes) as "always
      # true" under -tags notflite. Those guards are real runtime checks in the
      # default tflite build; suppress the stub-only false positive. CI never
      # lints the notflite tag (it is a compile check only), so this only affects
      # the notflite lint lane. NewTFLiteClassifier is called from birdnet.go and
      # NewTFLiteRangeFilter from range_filter_service.go.
      - path: internal/classifier/(birdnet|range_filter_service)\.go
        text: "SA4023"
        linters:
          - staticcheck
      # go-critic 0.15.0 (golangci-lint v2.14.0) extended sprintfQuotedString
      # with a pattern that suggests %#q over "`%s`". %#q silently falls back
      # to double quotes when the value cannot be backquoted, and double quotes
      # denote a string literal (not an identifier) in MySQL, so the explicit
      # backquotes are kept for SQL identifier quoting in the datastore
      # packages and the MySQL test container. The text match is the new
      # pattern's message only, so the check's older "%s" -> %q pattern still
      # applies to these paths.
      - path: internal/(datastore/|testutil/containers/mysql\.go)
        text: "use %#q instead of"
        linters:
          - gocritic
      # goconst v1.9.0+ started walking
      # composite-literal nodes (map keys, slice elements, struct-init values),
      # which surfaced hundreds of "make it a constant" nits for inline
      # structured-logging and DB/JSON field-name keys that are conventionally
      # left inline. There is no upstream toggle to scope that scan yet
      # (golangci/golangci-lint#6571), so suppress the extraction suggestions by
      # message. The "but such constant X already exists" findings are NOT
      # matched here, so goconst still flags literals that duplicate an existing
      # named constant.
      - text: "make it a constant"
        linters:
          - goconst
  enable:
    # Existing linters
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocognit
    - gocritic
    - misspell
    - predeclared
    - revive
    - unconvert
    - wastedassign  # Re-enabled under golangci-lint v2.13.2 + Go 1.27: the earlier go/ssa.CreatePackage SIGSEGV no longer reproduces, and a full-project run reports 0 issues
    # Security & quality linters
    # - gosec
    - goconst  # "constant already exists" enforcement; extraction nits suppressed via exclusions rule (see above)
    - staticcheck
    - ineffassign
    - bodyclose
    - fatcontext
    - iface
    - dupl
    #- ireturn
    - nilnil
    - nilerr
    - thelper
    - testifylint
    - gocyclo
    - modernize  # Re-enabled under golangci-lint v2.13.2 + Go 1.27: the earlier Go 1.26 atomic-types panic no longer reproduces, and the codebase was modernized in the same change
    - forbidigo  # Sensitive field name detection
    - depguard  # Bans the standard errors package; use internal/errors
    # Performance linters
    - prealloc
    - exhaustive
  disable:
    - unused
  settings:
    goconst:
      # Test strings are noisy and rarely worth deduplicating; the upstream CLI
      # defaults this to true but golangci-lint's integration defaults it to false.
      ignore-tests: true
    gocognit:
      min-complexity: 50
    depguard:
      rules:
        # internal/errors is a drop-in replacement for the standard errors
        # package (Is, As, AsType, Unwrap, Join, ErrUnsupported, NewStd). Only
        # its own passthrough file may import the standard package.
        stdlib-errors:
          files:
            - "$all"
            - "!**/internal/errors/errors.go"
          deny:
            - pkg: "errors$"
              desc: "import github.com/tphakala/birdnet-go/internal/errors instead; it passes through Is, As, AsType, Unwrap, Join, ErrUnsupported and NewStd (for errors.New)"
    gocritic:
      disabled-checks:
        - commentFormatting
        - commentedOutCode
      enabled-tags:
        - style
        - diagnostic
        - performance
      settings:
        ruleguard:
          rules: "rules/*.go"
    revive:
      # An explicit rules list replaces revive's defaults, so every rule that
      # should run is listed here. This is revive's default set minus the rules
      # the codebase does not yet satisfy (exported, package-comments,
      # var-naming, receiver-naming, context-as-argument, unexported-return)
      # and unused-parameter, plus use-slices-concat (revive 1.17, so this
      # config needs golangci-lint v2.14.0 or newer; older versions stop with
      # "cannot find rule: use-slices-concat").
      # revive re-typechecks files itself, and the golangci-lint release binary
      # is built with -trimpath, so the type-aware rules (time-naming and parts
      # of errorf, var-declaration and context-keys-type) only report when
      # GOROOT is set. `task lint`, the pre-commit hook and CI all set it; a
      # bare `golangci-lint run` should be prefixed with GOROOT="$(go env GOROOT)".
      # The result cache ignores GOROOT, so after a run without it, run
      # `golangci-lint cache clean` before trusting a clean result.
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
        - name: use-slices-concat
    gosec:
      # Configure gosec for security scanning
      excludes:
        - G104  # Audit errors not checked (covered by errcheck)
      severity: medium
      confidence: medium
    prealloc:
      # Configure prealloc for slice optimization
      simple: true
      range-loops: true
      for-loops: true
    exhaustive:
      # Check exhaustiveness of enum switch statements
      default-signifies-exhaustive: true
    forbidigo:
      # Detect potential sensitive data logging
      # Use logger.Username(), logger.Password(), logger.Token(), etc. instead
      forbid:
        # Password/credential field names - always use logger.Password() or logger.Credential()
        # Uses .* to catch variations like "user_password", "mqtt_secret", etc.
        - pattern: 'logger\.String\(\s*"(?i)[^"]*(password|passwd|pwd|secret|credential)[^"]*"'
          msg: "Use logger.Password() or logger.Credential() for sensitive credential fields instead of logger.String()"
        # Token field names - always use logger.Token()
        - pattern: 'logger\.String\(\s*"(?i)[^"]*(token|bearer|api_key|apikey|auth_token|access_token)[^"]*"'
          msg: "Use logger.Token() for token fields instead of logger.String()"
        # Username field names - always use logger.Username()
        - pattern: 'logger\.String\(\s*"(?i)[^"]*(username|user_name|userid|user_id|login)[^"]*"'
          msg: "Use logger.Username() for username fields instead of logger.String()"
        # Email addresses - should be sanitized
        - pattern: 'logger\.String\(\s*"(?i)[^"]*(email|e-mail|mail)[^"]*"'
          msg: "Use logger.SanitizedString() for email fields to redact sensitive data"
      analyze-types: false
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
